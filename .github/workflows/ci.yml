name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Check names: "python / test" and "web / test". Keep job ids stable.
  python:
    uses: yogigodaraa/.github/.github/workflows/python-ci.yml@main
    with:
      python-version: "3.12"

  web:
    uses: yogigodaraa/.github/.github/workflows/node-ci.yml@main
    with:
      working-directory: web
